name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0). Also pushes :latest."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.service.name }} (${{ matrix.platform.tag }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: agent, context: ., dockerfile: agent/Dockerfile }
          - { name: api, context: ., dockerfile: api/Dockerfile }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile }
          - { name: code-server, context: code-server, dockerfile: code-server/Dockerfile }
        platform:
          - { tag: amd64, name: linux/amd64, runner: ubuntu-latest }
          - { tag: arm64, name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: img
        run: |
          OWNER_LC="${OWNER,,}"
          echo "image=${REGISTRY}/${OWNER_LC}/karna-${{ matrix.service.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,name=${{ steps.img.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.platform.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.platform.tag }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.service.name }}-${{ matrix.platform.tag }}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service.name }}-${{ matrix.platform.tag }}
          path: /tmp/digests/${{ matrix.service.name }}-${{ matrix.platform.tag }}.txt
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: Manifest ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [agent, api, frontend, code-server]
    steps:
      - name: Resolve tag and image
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          OWNER_LC="${OWNER,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${OWNER_LC}/karna-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REFS=""
          for f in /tmp/digests/*.txt; do
            d=$(cat "$f")
            REFS="$REFS ${IMAGE}@${d}"
          done
          if [ -z "$REFS" ]; then
            echo "No digests found for ${IMAGE}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            $REFS

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

  chart:
    name: Publish OCI chart & bump main
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # Default checkout uses GITHUB_REF — the tagged commit. This is the
      # source the user actually tagged; the published chart MUST be built
      # from here, not from main (main may lag the tag).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stamp Chart.yaml version (in tagged working tree)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          sed -i -E "s/^version: .*/version: ${TAG}/" charts/karna/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${TAG}\"/" charts/karna/Chart.yaml
          echo "--- Chart.yaml at $(git rev-parse --short HEAD) ---"
          head -10 charts/karna/Chart.yaml

      - uses: azure/setup-helm@v4

      - name: Login to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${REGISTRY} -u ${{ github.actor }} --password-stdin

      - name: Package & push chart (from tagged source)
        run: |
          OWNER_LC="${OWNER,,}"
          helm dependency update charts/karna
          helm package charts/karna -d /tmp
          helm push /tmp/karna-${{ steps.tag.outputs.tag }}.tgz oci://${REGISTRY}/${OWNER_LC}/charts

      # Separately, bump Chart.yaml on main so the version string there
      # tracks the latest release. This is decoupled from packaging — main
      # is updated AFTER the chart is safely published.
      - name: Bump Chart.yaml on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.tag.outputs.tag }}"
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E "s/^version: .*/version: ${TAG}/" charts/karna/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${TAG}\"/" charts/karna/Chart.yaml
          git add charts/karna/Chart.yaml
          if git diff --staged --quiet; then
            echo "Chart already at ${TAG} on main, nothing to commit"
          else
            git commit -m "chore(chart): bump to ${TAG} [skip ci]"
            git push origin HEAD:main
          fi

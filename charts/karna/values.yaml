global:
  imageRegistry: ""
  imagePullSecrets: []

# -- API server (Rust/Axum)
api:
  image:
    repository: ghcr.io/warlord-k/karna-api
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
  podAnnotations: {}
  # Pod-level securityContext. Empty by default (API runs as root in current
  # image, no PVCs). Set fsGroup if you add a volume that needs non-root write.
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Agent worker (Rust)
agent:
  image:
    repository: ghcr.io/warlord-k/karna-agent
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  terminationGracePeriodSeconds: 600  # 10min drain for active tasks
  workspace:
    # Shared across all agent replicas. Multi-pod scaling (replicaCount > 1) requires
    # RWX-capable storage. On EKS this typically means EFS via the aws-efs-csi driver
    # (preferred). Other options: NFS, CephFS. Set storageClass to your RWX class and
    # flip accessMode to ReadWriteMany. Per-task isolation is handled by git worktrees,
    # so worker pods don't step on each other inside the shared volume.
    storageClass: ""
    size: 50Gi
    accessMode: ReadWriteOnce
  podAnnotations: {}
  # Pod-level securityContext. fsGroup=1000 matches the `agent` user baked
  # into the karna-agent image (useradd -u 1000). Without this, the workspace
  # PVC mounts as root:root and the agent process can't write.
  # OnRootMismatch avoids a slow recursive chmod on the 50Gi workspace.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra env vars appended to the agent container. Use this to pass arbitrary
  # tokens to custom skills without modifying the chart. Each entry is a raw
  # corev1.EnvVar, so `value:` or `valueFrom:` both work.
  # Example:
  #   extraEnv:
  #     - name: MY_TOOL_TOKEN
  #       valueFrom:
  #         secretKeyRef:
  #           name: my-tool-creds
  #           key: token
  extraEnv: []
  # envFrom sources appended to the agent container. Bulk-load every key of a
  # Secret or ConfigMap as env vars.
  # Example:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: my-tool-creds
  extraEnvFrom: []
  # Extra init containers run before the agent starts. Common pattern: drop
  # custom CLI binaries into a shared emptyDir mounted on PATH so skills can
  # invoke them without rebuilding the karna-agent image.
  # Example:
  #   extraInitContainers:
  #     - name: install-tfctl
  #       image: hashicorp/terraform:1.9
  #       command: [sh, -c, "cp /bin/terraform /custom-bin/"]
  #       volumeMounts:
  #         - name: custom-bin
  #           mountPath: /custom-bin
  extraInitContainers: []
  # Extra volumes mounted on the agent pod (e.g. emptyDir for custom binaries,
  # configMap for tool configs, secret for tool credentials).
  # Example:
  #   extraVolumes:
  #     - name: custom-bin
  #       emptyDir: {}
  extraVolumes: []
  # Extra volume mounts on the agent container. Pair with extraVolumes above.
  # Mount custom binaries onto PATH (e.g. /usr/local/bin or /home/agent/.local/bin).
  # Example:
  #   extraVolumeMounts:
  #     - name: custom-bin
  #       mountPath: /home/agent/.local/bin
  extraVolumeMounts: []

# -- Frontend (Next.js)
frontend:
  image:
    repository: ghcr.io/warlord-k/karna-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  podAnnotations: {}
  # Pod-level securityContext. Empty by default (frontend runs as root, no PVCs).
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Code-Server (browser IDE, optional)
codeServer:
  enabled: false
  image:
    repository: ghcr.io/warlord-k/karna-code-server
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  password: ""  # Override via secret; defaults to "changeme"
  extensions:
    storageClass: ""
    size: 5Gi
  podAnnotations: {}
  # Pod-level securityContext. fsGroup=1000 matches the `coder` user baked
  # into the upstream code-server image, so the extensions PVC is writable.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- PostgreSQL (Bitnami subchart)
# Bitnami sunset: free images moved to docker.io/bitnamilegacy/* in Aug 2025.
# The original bitnami/* namespace only ships paid/hardened tags now and old
# free tags have been purged. Pin to bitnamilegacy until we migrate off Bitnami.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  metrics:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgres-exporter
  auth:
    username: karna
    password: ""  # Auto-generated if empty
    database: karna
    existingSecret: ""
  primary:
    persistence:
      size: 20Gi
  # External DB (when postgresql.enabled=false)
  external:
    host: ""
    port: 5432
    username: karna
    password: ""
    database: karna
    existingSecret: ""
    # Key in existing secret containing the password
    existingSecretPasswordKey: password

# -- Redis (Bitnami subchart) — same sunset note as postgresql above.
redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
  sentinel:
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-sentinel
  metrics:
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-exporter
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  sysctl:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  kubectl:
    image:
      registry: docker.io
      repository: bitnamilegacy/kubectl
  auth:
    enabled: false
  master:
    persistence:
      size: 2Gi
  # External Redis (when redis.enabled=false)
  external:
    host: ""
    port: 6379
    password: ""

# -- Auth & Secrets
auth:
  # AUTH_SECRET for Auth.js session encryption (auto-generated if empty)
  secret: ""
  disabled: false
  signupDisabled: true
  # When true, every signed-in user can see and edit ALL tasks/schedules/repos
  # regardless of who created them. Suitable for small teams sharing one Karna
  # instance; pair with signupDisabled: true so only invited users can join.
  # Maps to KARNA_SHARED_WORKSPACE env on the api + agent.
  sharedWorkspace: false
  existingSecret: ""
  # Keys in existing secret
  existingSecretAuthKey: auth-secret

  # Explicit override for the AUTH_URL env var. Set this when the chart's
  # ingress is disabled (e.g. external ingress controller, TF-managed ALB).
  # If empty AND ingress is enabled, falls back to ingress.hosts[0].
  url: ""

  # Google OAuth (Auth.js). Set clientId + clientSecret to enable.
  # Callback URL to register in Google Cloud Console:
  #   {AUTH_URL}/api/auth/callback/google
  # where AUTH_URL is auth.url (if set) or derived from ingress.hosts[0].host.
  google:
    enabled: false
    clientId: ""
    clientSecret: ""
    # Comma-separated email domain allowlist (e.g. "company.com,partner.com").
    # Empty means any Google account can sign in — usually NOT what you want.
    allowedEmailDomains: ""
    # Reference an existing secret instead of inline values.
    existingSecret: ""
    existingSecretClientIdKey: google-client-id
    existingSecretClientSecretKey: google-client-secret

# -- GitHub
github:
  token: ""
  webhookSecret: ""
  existingSecret: ""
  existingSecretTokenKey: github-token
  existingSecretWebhookKey: webhook-secret

# -- Claude Code CLI
claude:
  oauthToken: ""
  existingSecret: ""
  existingSecretTokenKey: oauth-token

# -- Slack
slack:
  botToken: ""
  appToken: ""
  existingSecret: ""
  existingSecretBotTokenKey: slack-bot-token
  existingSecretAppTokenKey: slack-app-token

# -- opencode / OpenRouter (required when the `opencode` backend is enabled)
openrouter:
  apiKey: ""
  existingSecret: ""
  existingSecretApiKeyKey: openrouter-api-key

# -- MCP server secrets used by config.mcpServers[*].env placeholders (e.g. ${LINEAR_API_KEY})
mcpSecrets:
  # Inline key/value pairs templated into the chart-managed Secret.
  # Example:
  # inline:
  #   LINEAR_API_KEY: "lin_..."
  #   SENTRY_AUTH_TOKEN: "sntrys_..."
  inline: {}
  # Existing Kubernetes Secrets to bulk-load into the agent as env vars.
  # Each Secret key becomes an env var name.
  # Example:
  # existingSecrets:
  #   - my-mcp-tokens
  existingSecrets: []

# -- Agent configuration (rendered as config.yaml)
config:
  repos: []
  #  - repo: owner/my-app
  #    branch: main
  #    sync_issues: true
  maxTurns: 100
  pollIntervalSecs: 30
  maxReviewRounds: 3
  maxConcurrentTasks: 1
  memory:
    enabled: false
    # Leave empty to auto-resolve:
    # - mem0 service URL when mem0.enabled=true
    # - http://localhost:8888 otherwise
    url: ""
    maxItems: 8
    maxChars: 2000
  slack:
    enabled: false
    defaultChannel: ""
    dmUserIds: []
    allowedUserIds: []
    userMap: {}
  backends:
    claude:
      models: [opus, sonnet, haiku]
      default_model: sonnet
    codex:
      models: [gpt-5.4, gpt-5.4-mini, gpt-5.3-codex]
      default_model: gpt-5.4
    # opencode routes through any OpenRouter model. Requires OPENROUTER_API_KEY
    # in the deployment env (see secret.yaml / existingSecret).
    opencode:
      models:
        - openrouter/moonshotai/kimi-k2.6
        - openrouter/moonshotai/kimi-k2-thinking
        - openrouter/deepseek/deepseek-v3
        - openrouter/qwen/qwen3-coder
      default_model: openrouter/moonshotai/kimi-k2.6
  mcpServers: []
  #  - name: linear
  #    command: npx
  #    args: ["-y", "@linear/mcp-server"]
  #    env:
  #      LINEAR_API_KEY: "${LINEAR_API_KEY}"
  #  - name: sentry
  #    command: npx
  #    args: ["-y", "@sentry/mcp-server"]
  #    env:
  #      SENTRY_AUTH_TOKEN: "${SENTRY_AUTH_TOKEN}"
  #  - name: generic-token-server
  #    command: npx
  #    args: ["-y", "@example/mcp-server"]
  #    env:
  #      EXAMPLE_MCP_TOKEN: "${EXAMPLE_MCP_TOKEN}"
  #
  # Pair the placeholders above with mcpSecrets (or your own existing secrets):
  # mcpSecrets:
  #   inline:
  #     LINEAR_API_KEY: "lin_..."
  #     SENTRY_AUTH_TOKEN: "sntrys_..."
  #     EXAMPLE_MCP_TOKEN: "token_..."
  #   existingSecrets:
  #     - my-mcp-tokens
  instructions: ""
  existingConfigMap: ""

# -- Optional in-cluster mem0 stack
mem0:
  enabled: false
  # Shared API key used for both llm/embedder unless provider-specific keys are
  # supplied elsewhere. Useful when pointing mem0 at OpenAI directly.
  apiKey: ""
  existingSecret: ""
  existingSecretApiKeyKey: api-key
  # OpenRouter-specific override for mem0. If unset, mem0 falls back to the
  # global openrouter.* values used by the agent's opencode backend.
  openrouterApiKey: ""
  openrouterExistingSecret: ""
  openrouterExistingSecretApiKeyKey: openrouter-api-key
  # Legacy field kept for backwards compatibility with older values files.
  openaiApiKey: ""
  llm:
    provider: openai
    model: openai/gpt-4o-mini
    baseUrl: https://openrouter.ai/api/v1
  embedder:
    provider: openai
    # text-embedding-3-small is 1536 dims by default in mem0/openai.
    model: openai/text-embedding-3-small
    baseUrl: https://openrouter.ai/api/v1
  jwtSecret: mem0-local-dev-secret
  authDisabled: true
  telemetry: false
  api:
    image:
      # Upstream mem0/mem0-api-server:latest is arm64-only and won't run on our
      # amd64 nodes. karna-mem0 is our multi-arch rebuild (see .github/workflows/mem0-image.yml).
      repository: ghcr.io/warlord-k/karna-mem0
      tag: "2.0.6"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  postgres:
    image:
      repository: ankane/pgvector
      tag: v0.5.1
      pullPolicy: IfNotPresent
    auth:
      username: postgres
      password: postgres
      database: mem0_app
    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  history:
    persistence:
      enabled: false
      storageClass: ""
      size: 2Gi

# -- Git identity for agent commits
git:
  authorName: "Karna Agent"
  authorEmail: "agent@karna.dev"
  signing:
    enabled: false
    # Name of existing secret containing SSH signing key (key: signing-key)
    existingSecret: ""

# -- Email notifications (optional, requires Resend)
notifications:
  email: ""
  fromEmail: ""
  resendApiKey: ""
  existingSecret: ""
  existingSecretApiKeyKey: resend-api-key

# -- Ingress
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: karna.example.com
      paths:
        - path: /
          service: frontend
        - path: /api
          service: api
  tls: []
  #  - secretName: karna-tls
  #    hosts:
  #      - karna.example.com

  # Agent webhook ingress (for GitHub webhooks)
  agent:
    enabled: false
    host: agent.example.com
    path: /webhooks/github
    annotations: {}
    tls: []

  # Code-server ingress
  codeServer:
    enabled: false
    host: code.example.com
    annotations: {}
    tls: []

# -- Pod disruption budgets
podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 1
  frontend:
    enabled: true
    minAvailable: 1
  # Agent PDB only renders when agent.replicaCount > 1 (a single-replica PDB
  # with minAvailable: 1 would block node drains entirely).
  agent:
    enabled: true
    minAvailable: 1

# -- Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Migration job
migration:
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

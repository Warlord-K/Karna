{{- $mcpInline := .Values.mcpSecrets.inline | default dict }}
{{- if or (not .Values.auth.existingSecret) (gt (len $mcpInline) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "karna.secretName" . }}
  labels:
    {{- include "karna.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.auth.existingSecret }}
  auth-secret: {{ (.Values.auth.secret | default (randAlphaNum 64)) | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.github.existingSecret) .Values.github.token }}
  github-token: {{ .Values.github.token | b64enc | quote }}
  {{- end }}
  {{- if .Values.github.webhookSecret }}
  webhook-secret: {{ .Values.github.webhookSecret | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.claude.existingSecret) .Values.claude.oauthToken }}
  oauth-token: {{ .Values.claude.oauthToken | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.slack.existingSecret) .Values.slack.botToken }}
  slack-bot-token: {{ .Values.slack.botToken | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.slack.existingSecret) .Values.slack.appToken }}
  slack-app-token: {{ .Values.slack.appToken | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.openrouter.existingSecret) .Values.openrouter.apiKey }}
  openrouter-api-key: {{ .Values.openrouter.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.mem0.existingSecret) .Values.mem0.apiKey }}
  mem0-api-key: {{ .Values.mem0.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.mem0.openrouterExistingSecret) .Values.mem0.openrouterApiKey }}
  mem0-openrouter-api-key: {{ .Values.mem0.openrouterApiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.mem0.existingSecret) .Values.mem0.openaiApiKey }}
  mem0-openai-api-key: {{ .Values.mem0.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- range $envName := keys $mcpInline | sortAlpha }}
  {{ $envName }}: {{ index $mcpInline $envName | toString | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) (not .Values.postgresql.external.existingSecret) .Values.postgresql.external.password }}
  postgres-password: {{ .Values.postgresql.external.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.codeServer.password }}
  code-server-password: {{ .Values.codeServer.password | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.notifications.existingSecret) .Values.notifications.resendApiKey }}
  resend-api-key: {{ .Values.notifications.resendApiKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.auth.google.enabled (not .Values.auth.google.existingSecret) .Values.auth.google.clientId }}
  google-client-id: {{ .Values.auth.google.clientId | b64enc | quote }}
  {{- end }}
  {{- if and .Values.auth.google.enabled (not .Values.auth.google.existingSecret) .Values.auth.google.clientSecret }}
  google-client-secret: {{ .Values.auth.google.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}

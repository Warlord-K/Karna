services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: karna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karna}
      POSTGRES_DB: karna
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: pg_isready -U karna
      interval: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: karna
      POSTGRES_DB: karna
      PGPASSWORD: ${POSTGRES_PASSWORD:-karna}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/migrations/run.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 5

  # Optional mem0 stack (enable with: docker compose --profile memory up -d mem0)
  # Karna agent config should point `memory.url` at this service (default: http://localhost:8888).
  mem0-postgres:
    image: ankane/pgvector:v0.5.1
    profiles: ["memory"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${MEM0_APP_DB_NAME:-mem0_app}
    volumes:
      - mem0-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mem0:
    image: mem0/mem0-api-server:latest
    profiles: ["memory"]
    environment:
      LLM_PROVIDER: ${MEM0_LLM_PROVIDER:-openai}
      LLM_MODEL: ${MEM0_LLM_MODEL:-openai/gpt-4o-mini}
      LLM_API_KEY: ${MEM0_LLM_API_KEY:-${MEM0_API_KEY:-${MEM0_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-${MEM0_OPENAI_API_KEY:-}}}}}
      LLM_BASE_URL: ${MEM0_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-openai}
      EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-openai/text-embedding-3-small}
      EMBEDDER_API_KEY: ${MEM0_EMBEDDER_API_KEY:-${MEM0_API_KEY:-${MEM0_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-${MEM0_OPENAI_API_KEY:-}}}}}
      EMBEDDER_BASE_URL: ${MEM0_EMBEDDER_BASE_URL:-https://openrouter.ai/api/v1}
      # Compatibility for mem0 code paths that still consult OPENAI_* / OPENROUTER_* envs.
      OPENROUTER_API_KEY: ${MEM0_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}
      OPENAI_API_KEY: ${MEM0_OPENAI_API_KEY:-${MEM0_API_KEY:-${MEM0_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}}}
      OPENAI_BASE_URL: ${MEM0_OPENAI_BASE_URL:-${MEM0_EMBEDDER_BASE_URL:-${MEM0_LLM_BASE_URL:-https://openrouter.ai/api/v1}}}
      JWT_SECRET: ${MEM0_JWT_SECRET:-mem0-local-dev-secret}
      AUTH_DISABLED: ${MEM0_AUTH_DISABLED:-true}
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:-postgres}
      APP_DB_NAME: ${MEM0_APP_DB_NAME:-mem0_app}
      MEM0_TELEMETRY: ${MEM0_TELEMETRY:-false}
    depends_on:
      mem0-postgres: { condition: service_healthy }
    ports:
      - "${MEM0_PORT:-8888}:8000"
    volumes:
      - mem0-history:/app/history
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://karna:${POSTGRES_PASSWORD:-karna}@postgres:5432/karna
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
      CONFIG_PATH: /etc/karna/config.yaml
      PORT: "8081"
    volumes:
      - ./config.yaml:/etc/karna/config.yaml:ro
    ports:
      - "${API_PORT:-8081}:8081"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://karna:${POSTGRES_PASSWORD:-karna}@postgres:5432/karna
      REDIS_URL: redis://redis:6379
      REPOS_DIR: /workspace
      WORKSPACES_DIR: /workspace/.workspaces
      CONFIG_PATH: /etc/karna/config.yaml
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Karna Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-agent@karna.dev}
      TUNNEL_AGENT_HOSTNAME: ${TUNNEL_AGENT_HOSTNAME:-}
    volumes:
      - workspace:/workspace
      - ./config.yaml:/etc/karna/config.yaml:ro
      - ./skills:/etc/karna/skills:ro
      - ~/.codex:/home/agent/.codex
      - ./signing:/home/agent/.ssh/signing:ro    # Drop SSH key here → auto-signed commits
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - "${AGENT_API_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 10m   # Max wait for active tasks; idle shutdown is near-instant
    # Scale: docker compose up --scale agent=3

  frontend:
    build: ./frontend
    environment:
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgres://karna:${POSTGRES_PASSWORD:-karna}@postgres:5432/karna
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
      SIGNUP_DISABLED: ${SIGNUP_DISABLED:-}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${TUNNEL_FRONTEND_HOSTNAME:+https://${TUNNEL_FRONTEND_HOSTNAME}}
      API_URL: http://api:8081
      NODE_OPTIONS: "--max-old-space-size=384"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>{r.resume();process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped

  code-server:
    build: ./code-server
    env_file: .env
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - workspace:/workspace
      - ./config.yaml:/etc/karna/config.yaml:ro
      - code-server-extensions:/home/coder/.local/share/code-server/extensions
    ports:
      - "${CODE_SERVER_PORT:-8443}:8080"
    command: --auth password --bind-addr 0.0.0.0:8080 /workspace
    healthcheck:
      test: curl -fsS http://localhost:8080/healthz > /dev/null || exit 1
      interval: 5s
      start_period: 180s
      retries: 5

  # Cloudflare Tunnel — auto-starts if CF credentials are configured in .env
  # Exits cleanly and stays stopped if no credentials are set.
  #
  # Two modes:
  #   1. Token-based: set CLOUDFLARE_TUNNEL_TOKEN (routes managed in CF dashboard)
  #   2. Credentials-based: set CLOUDFLARE_TUNNEL_ID + CLOUDFLARE_TUNNEL_CREDENTIALS
  #      + TUNNEL_FRONTEND_HOSTNAME / TUNNEL_CODE_SERVER_HOSTNAME (routes defined in code)
  tunnel:
    build: ./tunnel
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
      CLOUDFLARE_TUNNEL_CREDENTIALS: ${CLOUDFLARE_TUNNEL_CREDENTIALS:-}
      TUNNEL_FRONTEND_HOSTNAME: ${TUNNEL_FRONTEND_HOSTNAME:-}
      TUNNEL_CODE_SERVER_HOSTNAME: ${TUNNEL_CODE_SERVER_HOSTNAME:-}
      TUNNEL_AGENT_HOSTNAME: ${TUNNEL_AGENT_HOSTNAME:-}
    depends_on:
      frontend:
        condition: service_healthy
      code-server:
        condition: service_healthy
      agent:
        condition: service_started
    restart: on-failure

  autoheal:
    image: willfarrell/autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mem0-pgdata:
  mem0-history:
  workspace:
  code-server-extensions:    # Persist installed extensions across restarts
